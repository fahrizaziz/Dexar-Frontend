<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Glowing Accent Orbs -->
  <circle cx="150" cy="120" r="180" fill="#10b981" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="500" r="220" fill="#0284c7" opacity="0.12" filter="url(#glow)" />

  <!-- App Header Bar Mockup -->
  <rect x="60" y="40" width="1080" height="50" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="90" cy="65" r="6" fill="#ef4444" />
  <circle cx="110" cy="65" r="6" fill="#f59e0b" />
  <circle cx="130" cy="65" r="6" fill="#10b981" />
  <text x="160" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">WFH PORTAL ENTERPRISE v1.0 — Micro-Frontend Architecture</text>

  <!-- Title Section -->
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff">WFH Portal &amp; HR Governance System</text>
  <text x="60" y="185" font-family="Arial, sans-serif" font-size="18" fill="#10b981" font-weight="bold">System Presensi WFH, Geofencing, Liveness Check &amp; HR Analytics</text>

  <!-- Feature Cards Grid -->
  
  <!-- Card 1: Clock In WFH -->
  <rect x="60" y="220" width="340" height="170" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <rect x="80" y="240" width="40" height="40" rx="8" fill="#10b981" opacity="0.2" />
  <path d="M92 260 L98 266 L108 254" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <text x="135" y="258" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">1. Clock In &amp; Liveness</text>
  <text x="135" y="276" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Webcam Selfie + Real-time</text>
  <text x="135" y="292" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Blink Face Anti-Spoofing</text>
  <rect x="80" y="315" width="300" height="28" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="90" y="333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#10b981">✓ Verified Liveness Score: 98.5%</text>

  <!-- Card 2: Geofencing Radius -->
  <rect x="430" y="220" width="340" height="170" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <rect x="450" y="240" width="40" height="40" rx="8" fill="#0284c7" opacity="0.2" />
  <circle cx="470" cy="260" r="10" stroke="#38bdf8" stroke-width="2" fill="none" />
  <circle cx="470" cy="260" r="4" fill="#38bdf8" />
  <text x="505" y="258" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">2. Geofence Restriksi</text>
  <text x="505" y="276" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Validasi Koordinat GPS</text>
  <text x="505" y="292" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Radius Alamat Rumah / Kantor</text>
  <rect x="450" y="315" width="300" height="28" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="460" y="333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">📍 Within Geofence Radius (12m)</text>

  <!-- Card 3: Daily Work Log -->
  <rect x="800" y="220" width="340" height="170" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <rect x="820" y="240" width="40" height="40" rx="8" fill="#8b5cf6" opacity="0.2" />
  <path d="M832 252 H848 M832 260 H848 M832 268 H842" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none" />
  <text x="875" y="258" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">3. Daily Work Log</text>
  <text x="875" y="276" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Mandatory 2-3 Bullet Points</text>
  <text x="875" y="292" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Ringkasan Hasil Kerja saat Pulang</text>
  <rect x="820" y="315" width="300" height="28" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
  <text x="830" y="333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c4b5fd">📝 Log Submitted on Clock Out</text>

  <!-- Bottom Row: HRD Analytics & Payroll Export -->
  <rect x="60" y="410" width="520" height="160" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="90" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">4. HRD Monitoring Dashboard &amp; Audit Trail</text>
  <text x="90" y="470" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Fitur lengkap HRD untuk pantau absensi real-time, foto selfie, koordinat GPS, filter departemen, serta audit trail aktivitas sistem.</text>
  <rect x="90" y="500" width="160" height="34" rx="8" fill="#10b981" />
  <text x="110" y="522" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Live Monitoring</text>
  <rect x="260" y="500" width="160" height="34" rx="8" fill="#0284c7" />
  <text x="280" y="522" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Audit Detail Modal</text>

  <rect x="620" y="410" width="520" height="160" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="650" y="445" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">5. Rekap Payroll &amp; Export (Excel / PDF / DOCX)</text>
  <text x="650" y="470" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">Hitung otomatis tunjangan WFH, potongan keterlambatan, rekap jam kerja, serta download laporan API Spec Word (.docx) &amp; Excel (.xlsx).</text>
  <rect x="650" y="500" width="180" height="34" rx="8" fill="#0369a1" />
  <text x="668" y="522" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">📄 Export Excel &amp; PDF</text>
  <rect x="840" y="500" width="200" height="34" rx="8" fill="#0284c7" />
  <text x="852" y="522" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">📘 Spec API Backend .docx</text>

  <!-- Footer Tag -->
  <text x="1140" y="605" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Powered by React 18, Vite, Tailwind CSS &amp; Micro-Frontend Architecture</text>
</svg>
