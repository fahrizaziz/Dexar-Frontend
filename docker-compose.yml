version: '3.8'

services:
  wfh-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wfh_portal_app
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
